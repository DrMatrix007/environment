set -g default-shell pwsh

set -g mouse on
set -g escape-time 0
set -g renumber-windows on
set -g history-limit 10000

set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 16
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #{p14:#{=/11/...:#{session_name}}} #[fg=#7aa2f7,bg=#1a1b26,nobold]"

set -g window-status-separator ""
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W #[fg=#bb9af7,bg=#1a1b26,nobold]"

set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#f7768e]#[bold]  PREFIX  ,}#{?window_zoomed_flag,#[fg=#e0af68]  ZOOM  ,}#[fg=#1a1b26,bg=#9ece6a,bold] %H:%M #[fg=#9ece6a,bg=#7aa2f7,nobold]#[fg=#1a1b26,bold] %d-%b-%y "

set -g pane-border-status top
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"

bind-key -T prefix T split-window -h "proj open"
bind-key -T prefix A split-window -h "proj ai"
bind-key -T prefix a split-window -h "proj ai --here"
bind-key -T prefix r source-file "~/.psmux.conf" \; display-message "psmux.conf reloaded"

bind-key -n C-M-Left previous-window
bind-key -n C-M-Right next-window

# Vertical navigation using PowerShell execution
bind-key -n C-M-Up run-shell 'powershell -NoProfile -Command "$w = (psmux display-message -p \"#W\"); psmux switch-client -n; psmux select-window -t \":$w\""'
bind-key -n C-M-Down run-shell 'powershell -NoProfile -Command "$w = (psmux display-message -p \"#W\"); psmux switch-client -p; psmux select-window -t \":$w\""'
# manage project sessions (full-screen TUI)
bind-key -n M-s display-popup -E -w 80% -h 80% "& \"$HOME/Projects/environment/dist/target/release/proj.exe\" manage"

# pane nav/resize without prefix
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D
bind-key -r -n M-S-Left resize-pane -L 5
bind-key -r -n M-S-Right resize-pane -R 5
bind-key -r -n M-S-Up resize-pane -U 5
bind-key -r -n M-S-Down resize-pane -D 5

# window jumps without prefix
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

# splits that keep the current pane's directory
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

bind-key e setw synchronize-panes
